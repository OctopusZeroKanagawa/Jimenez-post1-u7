<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- El título cambia dinámicamente: "Crear Producto" o "Editar Producto" -->
    <title th:text="${accion} + ' Producto'">Producto</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 2rem;
            color: #333;
        }

        h1 {
            color: #C62828;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .card {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 2rem;
            max-width: 560px;
        }

        label {
            display: block;
            margin-top: 1.2rem;
            font-weight: bold;
            font-size: 0.9rem;
            color: #555;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 9px 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #C62828;
        }

        textarea { resize: vertical; }

        .actions {
            margin-top: 1.8rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 9px 20px;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }

        .btn-save {
            background: #C62828;
            color: white;
        }
        .btn-save:hover { background: #7F0000; }

        .btn-cancel {
            background: #757575;
            color: white;
        }
        .btn-cancel:hover { background: #424242; }
    </style>
</head>
<body>

    <h1 th:text="${accion} + ' Producto'">Producto</h1>

    <div class="card">
        <!--
            th:action: URL destino del formulario → POST /productos/guardar
            th:object: enlaza el formulario con el objeto "producto" del Model.
            Los campos usan th:field="*{atributo}" para el binding bidireccional.
        -->
        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

            <!--
                Campo oculto CRÍTICO para edición:
                Envía el ID del producto para que el servicio actualice
                el registro existente en lugar de crear uno nuevo.
                En creación, el valor será vacío (null → Spring lo ignora).
            -->
            <input type="hidden" th:field="*{id}">

            <label for="nombre">Nombre:</label>
            <input type="text"
                   th:field="*{nombre}"
                   id="nombre"
                   placeholder="Ej: Laptop Dell XPS"
                   required>

            <label for="descripcion">Descripción:</label>
            <textarea th:field="*{descripcion}"
                      id="descripcion"
                      rows="3"
                      placeholder="Descripción breve del producto"></textarea>

            <label for="precio">Precio ($):</label>
            <input type="number"
                   th:field="*{precio}"
                   id="precio"
                   step="0.01"
                   min="0"
                   placeholder="0.00"
                   required>

            <div class="actions">
                <!-- El texto del botón también cambia según la acción -->
                <button type="submit"
                        class="btn btn-save"
                        th:text="${accion} + ' Producto'">Guardar</button>

                <!-- Cancelar regresa a la lista sin guardar cambios -->
                <a th:href="@{/productos}" class="btn btn-cancel">Cancelar</a>
            </div>

        </form>
    </div>

</body>
</html>
